services:
  backend:
    build:
      context: ./sentry-id-backend
      dockerfile: Dockerfile
    container_name: sentry-id-backend
    ports:
      - "8000:8000"
    environment:
      - API_KEY=demo-officer-key-12345
      - ENVIRONMENT=production
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./fake-id-screening
      dockerfile: Dockerfile
    container_name: sentry-id-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
